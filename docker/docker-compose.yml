version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hiver-backend
    ports:
      - "8000:8000"
    environment:
      HIVER_API_HOST: "0.0.0.0"
      HIVER_API_PORT: "8000"
      HIVER_API_BASE_URL: "http://backend:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: hiver-frontend
    ports:
      - "8501:8501"
    environment:
      HIVER_API_BASE_URL: "http://backend:8000"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
