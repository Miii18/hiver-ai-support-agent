services:
  - type: web
    name: hiver-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/run_api.py"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HOME
        value: "/opt/render/.cache/huggingface"
      - key: HIVER_API_HOST
        value: "0.0.0.0"

  - type: web
    name: hiver-frontend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt streamlit"
    startCommand: "python scripts/run_streamlit.py"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HIVER_API_BASE_URL
        value: "https://hiver-backend.onrender.com"
